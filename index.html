<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Conquête</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>CONQUÊTE</h1>
    <div id="game-status">PHASE : <span id="current-phase">PLACEMENT</span></div>
    <div id="turn-counter">Tour 1</div>
</header>

<main class="game_container">

    <!-- JOUEUR 1 -->
    <aside class="info_jouergauche">
        <div class="player-title">JOUEUR 1</div>

        <div>
            <div class="stat-label">OR</div>
            <div class="stat-value">100</div>
        </div>

        <div>
            <div class="stat-label">CASES</div>
            <div class="stat-value">4</div>
        </div>

        <div class="unit-list">
            <div class="unit-item">
                <span>Infanterie</span>
                <span class="unit-count">x2</span>
            </div>
            <div class="unit-item">
                <span>Tank</span>
                <span class="unit-count">x1</span>
            </div>
        </div>

        <button class="btn-acheter">ACHETER</button>
    </aside>

    <!-- GRILLE -->
    <section class="grid-container">

        <div class="grid-wrapper">

            <!-- Ligne lettres -->
            <div></div>
            <div class="coord-label">A</div>
            <div class="coord-label">B</div>
            <div class="coord-label">C</div>
            <div class="coord-label">D</div>
            <div class="coord-label">E</div>
            <div class="coord-label">F</div>
            <div class="coord-label">G</div>
            <div class="coord-label">H</div>

            <!-- Grille complète -->
            <!-- On génère 8 lignes -->

            <!-- LIGNE 0 -->
            <div class="coord-label">0</div>
            <div class="cell zone-j1"><div class="unit-token player-1">1</div></div>
            <div class="cell zone-j1"></div>
            <div class="cell neutral"></div>
            <div class="cell bonus-atk"><span class="cell-badge">ATK</span></div>
            <div class="cell neutral"></div>
            <div class="cell bonus-def"><span class="cell-badge">DEF</span></div>
            <div class="cell neutral"></div>
            <div class="cell zone-j2"><div class="unit-token player-2">1</div></div>

            <!-- LIGNE 1 -->
            <div class="coord-label">1</div>
            <div class="cell zone-j1"></div>
            <div class="cell neutral reachable"></div>
            <div class="cell piege"><span class="cell-badge">TRP</span></div>
            <div class="cell neutral"></div>
            <div class="cell fort"><span class="cell-badge">FRT</span></div>
            <div class="cell neutral"></div>
            <div class="cell attackable"></div>
            <div class="cell zone-j2"></div>

            <!-- LIGNE 2 -->
            <div class="coord-label">2</div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell bonus-atk"><span class="cell-badge">ATK</span></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>

            <!-- LIGNE 3 -->
            <div class="coord-label">3</div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>

            <!-- LIGNE 4 -->
            <div class="coord-label">4</div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>

            <!-- LIGNE 5 -->
            <div class="coord-label">5</div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>

            <!-- LIGNE 6 -->
            <div class="coord-label">6</div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>

            <!-- LIGNE 7 -->
            <div class="coord-label">7</div>
            <div class="cell zone-j2"></div>
            <div class="cell zone-j2"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell neutral"></div>
            <div class="cell zone-j1"></div>
            <div class="cell zone-j1"></div>

        </div>

    </section>

    <!-- JOUEUR 2 -->
    <aside class="info_jouerdroit">
        <div class="player-title">JOUEUR 2</div>

        <div>
            <div class="stat-label">OR</div>
            <div class="stat-value">100</div>
        </div>

        <div>
            <div class="stat-label">CASES</div>
            <div class="stat-value">4</div>
        </div>

        <div class="unit-list">
            <div class="unit-item">
                <span>Infanterie</span>
                <span class="unit-count">x2</span>
            </div>
            <div class="unit-item">
                <span>Tank</span>
                <span class="unit-count">x1</span>
            </div>
        </div>

        <button class="btn-acheter">ACHETER</button>
    </aside>

</main>

</body>
</html>
