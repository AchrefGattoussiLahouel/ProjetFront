<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Conquête</title>
    <link rel="stylesheet" href="style.css">
</head>


<!-- MARKET MODAL -->
<div class="modal-overlay" id="modal-market">
    <div class="modal-box">
        <div class="modal-title">ACHETER UNE UNITÉ</div>
        <div id="shop-items"></div>
        <button class="modal-close" onclick="closeMarket()">FERMER</button>
    </div>
</div>




<body>

<header>
    <h1>CONQUÊTE</h1>
    <div id="game-status">PHASE : <span id="current-phase">PLACEMENT</span></div>
    <div id="turn-counter">Tour 1</div>
</header>
<div id="starter-message" style="padding:8px 20px;color:var(--text-gold)"></div>
<!-- Controls: roll dice to decide who starts, and end-turn -->
<!-- per-player controls are inside each aside (see below) -->

<main class="game_container">

    <!-- JOUEUR 1 -->
    <aside class="info_jouergauche">
        <div class="player-title">JOUEUR 1</div>

        <div>
            <div class="stat-label">OR</div>
            <div class="stat-value">100</div>
        </div>

        <div>
            <div class="stat-label">CASES</div>
            <div class="stat-value">4</div>
        </div>

        <div class="unit-list">
            <div class="unit-item">
                <span>Infanterie</span>
                <span class="unit-count">x2</span>
            </div>
            <div class="unit-item">
                <span>Tank</span>
                <span class="unit-count">x1</span>
            </div>
        </div>
        
        <div class="player-controls">
            <button id="btn-roll-1" class="btn-roll" onclick="rollDicePlayer(1)">🎲</button>
            <span class="roll-value" id="roll-1"></span>
            <button id="btn-end-1" class="btn-end" onclick="endTurnPlayer(1)">Fin de tour</button>
        </div>
        <button class="btn-acheter">ACHETER</button>
    </aside>

    <!-- GRILLE -->
    <section class="grid-container">

        <div class="grid-wrapper">
                <div class="grid" id="grid"></div>
        </div>

    </section>

    <!-- JOUEUR 2 -->
    <aside class="info_jouerdroit">
        <div class="player-title">JOUEUR 2</div>

        <div>
            <div class="stat-label">OR</div>
            <div class="stat-value">100</div>
        </div>

        <div>
            <div class="stat-label">CASES</div>
            <div class="stat-value">4</div>
        </div>

        <div class="unit-list">
            <div class="unit-item">
                <span>Infanterie</span>
                <span class="unit-count">x2</span>
            </div>
            <div class="unit-item">
                <span>Tank</span>
                <span class="unit-count">x1</span>
            </div>
        </div>
        <div class="player-controls">
            <button id="btn-roll-2" class="btn-roll" onclick="rollDicePlayer(2)">🎲</button>
            <span class="roll-value" id="roll-2"></span>
            <button id="btn-end-2" class="btn-end" onclick="endTurnPlayer(2)">Fin de tour</button>
        </div>
        <button class="btn-acheter">ACHETER</button>
    </aside>
    <div id="log-bar">
  <span id="log-label">LOG</span>
  <span id="log-text">En attente du placement — Joueur 1 commence.</span>
  <div id="legend">
    <div class="legend-item"><div class="legend-swatch sw-j1"></div>Zone J1</div>
    <div class="legend-item"><div class="legend-swatch sw-j2"></div>Zone J2</div>
    <div class="legend-item"><div class="legend-swatch sw-neutral"></div>Neutre</div>
    <div class="legend-item"><div class="legend-swatch sw-atk"></div>ATK</div>
    <div class="legend-item"><div class="legend-swatch sw-def"></div>DEF</div>
    <div class="legend-item"><div class="legend-swatch sw-piege"></div>Piège</div>
  </div>
</div>


</main>
<script type="module">
    import { initBoard, gameState } from "./gameState.js";
    import { render } from "./render.js";
    initBoard();
    window.selectedUnitType = null;

    window.rollDice = () => import('./gameActions.js').then(m => m.rollDiceForStart());
    window.endTurn = () => import('./gameActions.js').then(m => m.endTurn());

    window.rollDicePlayer = (p) => import('./gameActions.js').then(m => m.rollDice(p)).then(res => {
        if (!res) return;
        if (res && res.roll != null) document.getElementById(`roll-${p}`).textContent = res.roll;
        if (res && res.reason === 'already-rolled') {
            const log = document.getElementById('log-text');
            log.textContent = `Vous avez déjà lancé le dé.`;
            return;
        }
        if (res && res.reason === 'already-started') {
            const log = document.getElementById('log-text');
            log.textContent = `Le starter a déjà été déterminé.`;
            return;
        }
        if (res && res.tie) {
            // clear displays
            document.getElementById('roll-1').textContent = '';
            document.getElementById('roll-2').textContent = '';
            const log = document.getElementById('log-text');
            log.textContent = `Égalité — relancez les deux dés.`;
            return;
        }
        if (res && res.starter) {
            const starterEl = document.getElementById('starter-message');
            if (starterEl) starterEl.textContent = `Commence: Joueur ${res.starter}`;
        }
    });

    window.endTurnPlayer = (p) => import('./gameActions.js').then(m => m.endTurnFor(p)).then(res => {
        if (res && res.ok) {
            // update active highlight via render
        } else {
            const log = document.getElementById('log-text');
            log.textContent = `Impossible de finir le tour: ${res?.reason || 'erreur'}`;
        }
    });

    document.getElementById('current-phase').textContent = gameState.phase.toUpperCase();
    document.getElementById('turn-counter').textContent = `Tour ${gameState.turn}`;

    render();
</script>
</body>
</html>
