<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Conquête</title>
    <link rel="stylesheet" href="style.css">
</head>


<!-- MARKET MODAL -->
<div class="modal-overlay" id="modal-market">
    <div class="modal-box">
        <div class="modal-title">ACHETER UNE UNITÉ</div>
        <div id="shop-items"></div>
        <button class="modal-close" onclick="closeMarket()">FERMER</button>
    </div>
</div>




<body>

<header>
    <h1>CONQUÊTE</h1>
    <div id="game-status">PHASE : <span id="current-phase">PLACEMENT</span></div>
    <div id="turn-counter">Tour 1</div>
</header>

<main class="game_container">

    <!-- JOUEUR 1 -->
    <aside class="info_jouergauche">
        <div class="player-title">JOUEUR 1</div>

        <div>
            <div class="stat-label">OR</div>
            <div class="stat-value">100</div>
        </div>

        <div>
            <div class="stat-label">CASES</div>
            <div class="stat-value">4</div>
        </div>

        <div class="unit-list">
            <div class="unit-item">
                <span>Infanterie</span>
                <span class="unit-count">x2</span>
            </div>
            <div class="unit-item">
                <span>Tank</span>
                <span class="unit-count">x1</span>
            </div>
        </div>
        
        <button class="btn-acheter">ACHETER</button>
    </aside>

    <!-- GRILLE -->
    <section class="grid-container">

        <div class="grid-wrapper">
                <div class="grid" id="grid"></div>
        </div>

    </section>

    <!-- JOUEUR 2 -->
    <aside class="info_jouerdroit">
        <div class="player-title">JOUEUR 2</div>

        <div>
            <div class="stat-label">OR</div>
            <div class="stat-value">100</div>
        </div>

        <div>
            <div class="stat-label">CASES</div>
            <div class="stat-value">4</div>
        </div>

        <div class="unit-list">
            <div class="unit-item">
                <span>Infanterie</span>
                <span class="unit-count">x2</span>
            </div>
            <div class="unit-item">
                <span>Tank</span>
                <span class="unit-count">x1</span>
            </div>
        </div>

        <button class="btn-acheter">ACHETER</button>
    </aside>
    <div id="log-bar">
  <span id="log-label">LOG</span>
  <span id="log-text">En attente du placement — Joueur 1 commence.</span>
  <div id="legend">
    <div class="legend-item"><div class="legend-swatch sw-j1"></div>Zone J1</div>
    <div class="legend-item"><div class="legend-swatch sw-j2"></div>Zone J2</div>
    <div class="legend-item"><div class="legend-swatch sw-neutral"></div>Neutre</div>
    <div class="legend-item"><div class="legend-swatch sw-atk"></div>ATK</div>
    <div class="legend-item"><div class="legend-swatch sw-def"></div>DEF</div>
    <div class="legend-item"><div class="legend-swatch sw-piege"></div>Piège</div>
  </div>
</div>


</main>
<script type="module">
    import { initBoard } from "./gameState.js";
    import { render } from "./render.js";
    import { createUnit } from "./units.js";

    initBoard();
    const tank = createUnit('Tank', 1, 0, 0);   // full health → green bar
    const soldat = createUnit('Soldat', 2, 7, 7);
    soldat.health = 10;   // critical → red bar

    render();
</script>
</body>
</html>
